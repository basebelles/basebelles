name: 'Deploy Code'

on:
  push:
    branches: [ trunk ]

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Do a git checkout including submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Verify Workspace
        run: |
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
      - name: Verify Folder
        run: |
          ls -lah ${GITHUB_WORKSPACE}

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BELLES_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          REMOTE_HOST: ${{ secrets.BELLES_HOST }}
          REMOTE_USER: ${{ secrets.BELLES_USER }}
          TARGET: /home/${{ secrets.BELLES_USER }}/${{ secrets.BELLES_HOST }}/wp-content/plugins/basebelles
          EXCLUDE: "/.git/, /.github/"
