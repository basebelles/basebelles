name: 'Deploy Code'

on:
  push:
    branches: [ trunk ]

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Do a git checkout including submodules
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Verify Workspace
        run: |
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
      - name: Verify Folder
        run: |
          ls -lah ${GITHUB_WORKSPACE}

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BELLES_SSH_KEY }}
          ARGS: "-azv --delete"
          REMOTE_HOST: ${{ secrets.BELLES_HOST }}
          REMOTE_USER: ${{ secrets.BELLES_USER }}
          TARGET: "/home/${{ secrets.BELLES_USER }}/${{ secrets.BELLES_FOLDER }}/wp-content/plugins/basebelles/"
          # Dev-only files must be listed here: the rsync above runs with --delete over the whole
          # repo, so anything not excluded lands in the live plugin directory.
          EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, /tests/, /tools/, /.phpunit.cache/, .DS_Store, composer.json, composer.lock, package.json, package-lock.json, phpunit.xml.dist, phpcs.xml.dist"

      - name: Sync ACF JSON on Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.BELLES_HOST }}
          username: ${{ secrets.BELLES_USER }}
          key: ${{ secrets.BELLES_SSH_KEY }}
          script: |
            # Navigate to the WordPress root
            cd /home/${{ secrets.BELLES_USER }}/${{ secrets.BELLES_FOLDER }}

            # Run the ACF Sync
            /usr/bin/wp acf json sync --quiet
